# ===========================
# ||    HYPRLAND CONFIG    ||
# ===========================


# GESTURE
gesture = 3, horizontal, workspace
gesture = 3, down, close


# MONITOR
monitor = eDP-1,1920x1080@144,0x0,1


# PROGRAM VARS
$terminal = kitty
$fileManager = nautilus
$browser = chromium
$cursor = hyprctl setcursor WinSur-dark-cursors 20


# AUTOSTART
exec-once = swww-daemon
exec-once = swaync
exec-once = nm-applet
exec-once = waypaper --restore
exec-once = $cursor
exec-once = waybar -c ~/.config/waybar/hypr/config.json -s ~/.config/waybar/hypr/style.css


# ENVIRONMENT VARIABLES
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct

env = MOZ_ENABLE_WAYLAND,1
env = MOZ_USE_XINPUT2,1
env = MOZ_DBUS_REMOTE,1

env = GDK_BACKEND,wayland

env = LIBVA_DRIVER_NAME,radeonsi
env = AMD_DEBUG,info

env = _JAVA_AWT_WM_NONREPARENTING,1



# LOOK AND FEEL
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2

    col.active_border = rgba(8b7b8bff)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear

    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade

    animation = windows, 1, 7, default, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


# INPUT
input {
    kb_layout = us,ru,ua
    kb_options = grp:lalt_lshift_toggle

    follow_mouse = 1
    sensitivity = -0.1

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


# KEYBINDINGS
$mod = Mod4

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5% && pkill -RTMIN+2 waybar
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && pkill -RTMIN+2 waybar

# Launcher / browser / apps
bind = $mod, C, exec, $terminal
bind = $mod, B, exec, firefox
bind = $mod, N, exec, $fileManager
bind = $mod, G, exec, firefox --new-window "https://chatgpt.com/"
bind = $mod, T, exec, Telegram

# Waybar reopen
bind = $mod SHIFT, O, exec, pkill waybar && waybar -c ~/.config/waybar/hypr/config.json -s ~/.config/waybar/hypr/style.css & disown

# Basic WM actions
bind = $mod, Q, killactive
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, E, exec, wlogout
bind = $mod, M, exit
bind = $mod, E, togglefloating
bind = $mod, R, exec, rofi -show drun
bind = $mod, V, exec, cliphist list | rofi -dmenu -dpi 1 -p "" | cliphist decode | wl-copy

bind = $mod, P, pseudo
bind = $mod SHIFT, C, exec, hyprctl reload

# Swap window
bind = $mod SHIFT, A, swapwindow, l
bind = $mod SHIFT, D, swapwindow, r
bind = $mod SHIFT, W, swapwindow, u
bind = $mod SHIFT, S, swapwindow, d

# Resize
binde = $mod L_CTRL, A, resizeactive, -120 0
binde = $mod L_CTRL, D, resizeactive, 120 0
binde = $mod L_CTRL, W, resizeactive, 0 -120
binde = $mod L_CTRL, S, resizeactive, 0 120

# Focus movement
bind = $mod, A, movefocus, l
bind = $mod, D, movefocus, r
bind = $mod, W, movefocus, u
bind = $mod, S, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5

# Fullscreen
bind = $mod, F, fullscreen
bind = ,Print, exec, slurp | grim -g - - | wl-copy && wl-paste > /home/nikita/Sreenshots/$(date +'%Y-%m-%d-%H%M%S_grim.png')


# Mouse binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


# Volume + media
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

