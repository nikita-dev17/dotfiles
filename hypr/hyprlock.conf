# BACKGROUND
background {
    monitor = eDP-1 
    #path = screenshot
    path = /home/nikita/Wallpapers/a2f1463e-29de-494e-8398-d32a3e22f171.jpg
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor = eDP-1
    size = 250, 60
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(255,255,255,0.15)
    inner_color = rgba(0,0,0,0.20)

    dot_color = rgba(255,255,255,1.0)
    font_color = rgba(255,255,255,1.0)

    placeholder_text = Input password...
    placeholder_text_color = rgba(255,255,255,0.6)

    hide_input = false
    fade_on_empty = false
    rounding = -1

    position = 0, -200
    halign = center
    valign = center
}




# DATE
label {
  monitor = eDP-1
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = eDP-1
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}



