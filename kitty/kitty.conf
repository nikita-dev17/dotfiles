# vim:fileencoding=utf-8:foldmethod=marker

font_family      JetBrainsMono
font_size 14.0

cursor #E38CA3
cursor_trail 0
cursor_underline_thickness 1
cursor_beam_thickness 1

window_padding_width 15

foreground #F0E3E8
background #1A1216
background_opacity 0.75

selection_foreground #1A1216
selection_background #E38CA3

confirm_os_window_close 0
allow_remote_control yes
hide_window_decorations yes


# --- Normal colors ---

# Black (background accents)
color0 #140E11

# Red (muted autumn red)
color1 #D96C8C

# Green (olive / dry leaves)
color2 #BFA7B0

# Yellow (autumn yellow, not neon)
color3 #E38CA3

# Blue (warm desaturated)
color4 #9B6C7C

# Magenta (soft, dusty)
color5 #C58AA0

# Cyan (muted sky)
color6 #B89CA7

# White (main text)
color7 #F0E3E8


# --- Bright colors (still muted) ---

color8 #2B1E24
color9 #E38CA3
color10 #D6C2CB
color11 #F2B6C8
color12 #BFA1B2
color13 #E0A5B9
color14 #D8C0CA
color15 #FFF5F8
